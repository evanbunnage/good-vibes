<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Colorwork chart designer for knitters" />
    <link rel="canonical" href="https://skeinfiend.com/" />
    <!-- How a shared link looks (messages, Slack, social): the title, the line above, and a chart. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkeinFiend" />
    <meta property="og:url" content="https://skeinfiend.com/" />
    <meta property="og:title" content="SkeinFiend: design stranded colorwork charts" />
    <meta property="og:description" content="Colorwork chart designer for knitters" />
    <meta property="og:image" content="https://skeinfiend.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The SkeinFiend logo beside a colorwork hat chart: snowflakes, a peerie band, and the crown's decreases" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- What it is, for search engines. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SkeinFiend",
        "url": "https://skeinfiend.com/",
        "description": "Colorwork chart designer for knitters",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript"
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fraunces (soft) for headings and the chart name, Figtree for everything else, Martian Mono for the chart's numbers, Pirata One for the wordmark. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..650,0..100,0..1&family=Figtree:wght@400;500;600&family=Martian+Mono:wght@400;500&family=Pirata+One&display=swap" />
    <title>SkeinFiend: design stranded colorwork charts</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- For anything that doesn't run the app: what it is. -->
    <noscript>
      <h1>SkeinFiend</h1>
      <p>Colorwork chart designer for knitters, with WebMCP support for bring-your-own-agent assisted projects.</p>
      <p>SkeinFiend needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
